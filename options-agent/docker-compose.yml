services:
  options-agent:
    build: .
    container_name: options-agent
    restart: unless-stopped
    environment:
      # IBKR — shared ib-gateway (entryexpert network)
      - IBKR_HOST=${IBKR_HOST:-ib-gateway}
      - IBKR_PORT=${IBKR_PORT:-4004}
      - IBKR_CLIENT_ID=${IBKR_CLIENT_ID:-30}

      # Strategy
      - UNDERLYING=${UNDERLYING:-SPX}
      - ACTIVE_STRATEGY=${ACTIVE_STRATEGY:-BWB}

      # Risk — backtest-optimized defaults
      - MAX_CONCURRENT=${MAX_CONCURRENT:-6}
      - MAX_DAILY_LOSS=${MAX_DAILY_LOSS:-1500}
      - MAX_POSITION_RISK=${MAX_POSITION_RISK:-2500}
      - ACCOUNT_CAPITAL=${ACCOUNT_CAPITAL:-5000}
      - MAX_RISK_PER_TRADE_PCT=${MAX_RISK_PER_TRADE_PCT:-0.03}

      # Timing
      - SCAN_INTERVAL=${SCAN_INTERVAL:-60}
      - MONITOR_INTERVAL=${MONITOR_INTERVAL:-30}

      # Notifications (Telegram)
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}

      # Safety — set DRY_RUN=true to test without live orders
      - DRY_RUN=${DRY_RUN:-true}

      # Market data: 3=Delayed (free, safe default), 1=Live (requires IBKR subscription)
      # Agent auto-falls back to delayed if live subscription is not active (error 354/10089)
      - MARKET_DATA_TYPE=${MARKET_DATA_TYPE:-3}

      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=America/New_York

      # Wheel Strategy
      - WHEEL_ENABLED=${WHEEL_ENABLED:-false}
      - WHEEL_CAPITAL=${WHEEL_CAPITAL:-2500}
      - WHEEL_SYMBOLS=${WHEEL_SYMBOLS:-SOFI,HOOD,F}
      - WHEEL_MAX_PER_SYMBOL=${WHEEL_MAX_PER_SYMBOL:-2500}
      - WHEEL_MAX_POSITIONS=${WHEEL_MAX_POSITIONS:-2}

      # Wiki
      - WIKI_DIR=/app/wiki

      # Kronos Shadow Mode (Stage 3 — observation only)
      - KRONOS_SHADOW_ENABLED=${KRONOS_SHADOW_ENABLED:-false}
      - KRONOS_SHADOW_MODEL=${KRONOS_SHADOW_MODEL:-mini}
      - KRONOS_SHADOW_OVERLAY=${KRONOS_SHADOW_OVERLAY:-conservative}
      - KRONOS_SHADOW_TREND_GATE=${KRONOS_SHADOW_TREND_GATE:-true}
      - KRONOS_SHADOW_INTERVAL=${KRONOS_SHADOW_INTERVAL:-1200}
      - KRONOS_SHADOW_LOOKBACK=${KRONOS_SHADOW_LOOKBACK:-60}
      - KRONOS_SHADOW_HORIZON=${KRONOS_SHADOW_HORIZON:-10}
      - KRONOS_SHADOW_MAX_DAILY=${KRONOS_SHADOW_MAX_DAILY:-30}
      - KRONOS_SHADOW_DEVICE=${KRONOS_SHADOW_DEVICE:-cpu}
      - KRONOS_REPO_PATH=${KRONOS_REPO_PATH:-/kronos}

      # Trend Day Detection (defaults are fine — uncomment to override)
      # - TREND_ENABLED=true
      # - TREND_THRESHOLD=65
      # - TREND_HIGH_CONVICTION=80
      # - TREND_REDUCE_SIZE=50
      # - TREND_VOL_RATIO_EXTREME=4.0
      # - TREND_AD_EXTREME=2000
      # - TREND_TICK_EXTREME=800
      # - TREND_ETF_SPREAD=0.5
      # - TREND_OR_MINUTES=30
      # - TREND_BLOCK_PREMIUM=true
      # - TREND_CONVEXITY=false
      # - TREND_LOG_INTERNALS=true
    healthcheck:
      test: ["CMD", "python", "-c", "import json,sys; data=json.load(open('/app/data/heartbeat.json')); sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - /home/oghenetejiri/.hermes/workspace/investigations/Kronos:/kronos:ro
    networks:
      # Must be on the same network as ib-gateway
      - stockalert-network

  options-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: options-agent-dashboard
    ports:
      - "8502:8501"
    environment:
      - DATA_DIR=/data
      - LOG_DIR=/logs
      - TZ=America/New_York
    volumes:
      - ./data:/data:ro
      - ./logs:/logs:ro
    restart: unless-stopped
    networks:
      - stockalert-network

volumes: {}

networks:
  stockalert-network:
    external: true
    name: entryexpert_stockalert-network
