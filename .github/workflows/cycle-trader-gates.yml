# CY-1 gate suite.
#
# LOCATION IS LOAD-BEARING. GitHub Actions reads workflows only from the
# repository root's .github/workflows/, and the repository here is ~/apps — the
# whole monorepo — not ~/apps/cycle-trader. A copy of this file under
# cycle-trader/.github/workflows/ is an ordinary text file: it never runs, and
# nothing warns you. The `paths:` filter is what keeps it from firing on the
# other ~60 projects in this repo.
#
# Why CI rather than a local hook (CLAUDE.md, "Environment"): a full
# 2011->present rebuild exceeds Vercel's function timeout, so the gates cannot
# live with the deployment. CI imports the same package Vercel deploys, so the
# gates verify the code that actually trades.
#
# The suite must also run from a cold clone with one command (PRD §P2):
#
#     git clone <repo> && cd <repo>/cycle-trader && pip install ".[dev]" && pytest
#
# The Install step below runs that exact command, deliberately: a documented
# command the workflow does not itself execute is a command nobody is checking.
# (It was `pip install -e` for one commit while this comment said otherwise.)
# Editable adds nothing here — pyproject's `pythonpath = ["."]` already makes
# pytest import the source tree, which is what Vercel deploys — and the project
# forbids editable installs into the shared venv, so `-e` in the documented
# command would be a trap for anyone pasting it locally.
#
# There is no network access, no API key and no fixture generation step — every
# input is a frozen snapshot under cycle-trader/data/reference/.
name: CY-1 gates

on:
  push:
    paths:
      - "cycle-trader/**"
      # Changes to the workflow itself must exercise the workflow itself.
      - ".github/workflows/cycle-trader-gates.yml"
  pull_request:
    paths:
      - "cycle-trader/**"
      - ".github/workflows/cycle-trader-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cy1-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cycle-trader
    steps:
      - uses: actions/checkout@v4
        with:
          # ~400 MB of history across ~60 unrelated projects. Shallow + cone
          # sparse-checkout keeps this to the one directory the gates read.
          fetch-depth: 1
          sparse-checkout: cycle-trader
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A sparse or shallow checkout that quietly landed an empty tree would
      # otherwise show green on a suite that collected nothing. Assert the
      # frozen inputs are present before anything can pass.
      - name: Assert the frozen reference data is present
        run: |
          test -s data/reference/btc_daily_full.json
          test -s data/reference/checkonchain_pricing.json
          test -s data/reference/coinmetrics_btc.csv
          test -s data/reference/cy1_lifecycle_reference.json

      - name: Install
        run: pip install ".[dev]"

      # The install above builds a wheel; `pythonpath = ["."]` then makes pytest
      # import the SOURCE TREE, so nothing in this job would notice a module
      # that failed to make it into the wheel. `[tool.setuptools.packages.find]`
      # is one edited line away from that (a stray `exclude`, a renamed
      # subpackage, an `engine/adapters/` added in M3 without an `__init__.py`),
      # and the failure surfaces as a Vercel ImportError at 00:05 UTC on a live
      # book, not here. Importing from /tmp puts the CWD out of scope so only
      # site-packages can satisfy it.
      #
      # `engine.engine` transitively pulls bars/levels/lifecycle/lines/orders/
      # rsi/structure/types/context; `engine.fills` is the one module it does
      # not reach, so it is named. `data` is test-only (its own docstring
      # forbids engine/ importing it) but ships in the same wheel, and the gates
      # cannot load a fixture without it.
      - name: Assert the installed wheel contains what Vercel will import
        working-directory: /tmp
        run: python -c "import engine.engine, engine.fills, data.loaders"

      # engine/ must stay stdlib-only, I/O-free and clock-free (CLAUDE.md).
      # Checked by AST in tests/test_engine_purity.py rather than by grep: four
      # legitimate constructs in this package (Bar.from_json, bar.open,
      # `from datetime import date, timedelta`, decimal.localcontext) make a
      # sound regex either wrong or unreadable. That file's own
      # `test_the_checker_actually_catches_impurity` proves the check has teeth.
      # Run first and alone so an impure engine fails in seconds with an
      # unambiguous step name, instead of inside a 250-test run.
      - name: Assert engine has no I/O, no clock and no third-party imports
        run: pytest tests/test_engine_purity.py -v

      # A SKIP IS NOT A PASS, and `pytest` treats it as one. Adding
      # `@pytest.mark.skip` to every test in tests/gates/test_entry_gates.py —
      # G1, G2 and G3, the owner's own chart reads and the reason this job
      # exists — gives `328 passed, 5 skipped` and exit 0. The collection floors
      # below cannot see it either: `--collect-only` counts skipped tests, so
      # the spine of the suite (PRD §P2) could be disabled in one line and
      # nothing would go red.
      #
      # Mechanism: JUnit XML rather than scraping the summary line. `skipped`,
      # `failures` and `errors` are attributes there, so the check does not
      # depend on pytest's human-readable output (which gains and loses clauses
      # — "N warnings", "N deselected" — between versions and would make the
      # gate fail for reasons that are not about tests), and it needs no plugin
      # the cold-clone command does not install. xfail is recorded as skipped
      # and so is caught by the same attribute.
      #
      # DESELECTION is the third vector and it is NOT visible here: a `-k` or
      # `-m` in pyproject's addopts removes tests before they are counted, so
      # both this total and the floors below fall together.
      #
      # It is caught by the floors below, but ONLY because they now (a) parse the
      # numerator out of pytest's "87/92 tests collected" deselect form and
      # (b) refuse an unparseable count outright. The first version of this step
      # did neither: `awk '{print $1}'` yielded "87/92", every `[ ]` comparison
      # became a bash parse error, and an `if` swallowed it as false — so all
      # five floors passed silently. Verified by attack: `-k` in addopts plus a
      # dozen padding tests disabled G1/G2/G3 with the whole job green.
      # If you touch this parsing, re-run that attack.
      - name: Run the full suite — every collected test must PASS
        run: |
          pytest -v --junit-xml=junit.xml
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("junit.xml").getroot()
          suites = root.findall("testsuite") or [root]
          got = {k: sum(int(s.get(k, 0)) for s in suites)
                 for k in ("tests", "skipped", "failures", "errors")}
          print(f"junit totals: {got}")
          bad = [k for k in ("skipped", "failures", "errors") if got[k]]
          if bad:
              sys.exit(f"the gate suite must run with none of {bad}: {got}. "
                       "A skipped or xfailed test is a disabled test; see this "
                       "step's comment in the workflow.")
          # Floor on the WHOLE suite, so a file with no floor of its own
          # (tests/test_fills.py, test_rsi.py, test_types.py, test_bars.py,
          # test_lines.py, test_engine_purity.py) cannot orphan itself silently.
          if got["tests"] < 372:
              sys.exit(f"only {got['tests']} tests ran; the suite has 372. "
                       "Something stopped being collected.")
          PY

      # PARTIAL loss is what these catch. Total loss does not need them:
      # `pytest` exits 5 (not 0) when a path collects nothing, so the step above
      # already fails — an earlier version of this comment claimed otherwise and
      # was wrong. But 75 gate tests silently becoming 30 — a file dropped from
      # collection, a rename that orphans a module, a conftest fixture error that
      # skips rather than fails, a `-k` added to addopts — exits 0 and shows
      # green on a suite that no longer checks the episodes.
      #
      # Every path here is a file whose loss is invisible from the others:
      #
      #   tests/gates        the owner's chart reads and the reference
      #                      reproduction — the reason the job exists.
      #   test_engine.py     `compute()`, the only thing M2 calls. The gates
      #                      mostly do not go through it.
      #   test_orders.py     the layer that turns levels into instructions to
      #                      spend money, including every refusal that stops a
      #                      short order set reaching the reconciler. Nothing in
      #                      tests/gates exercises those.
      #   test_structure.py  the LH/BoS/swing detectors, and the synthetic
      #                      fixtures that pin R_e's band edges — history alone
      #                      cannot reach them.
      #   test_lifecycle.py  triggers, chaining and EL*'s freeze. The freeze in
      #                      particular is ONLY observable here: on the frozen
      #                      series no post-BoS low ever prints, so the gates
      #                      cannot distinguish frozen from running.
      #
      # Floors only ever need raising.
      - name: Assert each suite actually ran
        run: |
          set -e
          while read -r path floor; do
            # Under deselection pytest prints "87/92 tests collected (5 deselected)",
            # so a bare `print $1` yields "87/92" and every downstream `[ ]`
            # comparison becomes a bash PARSE ERROR — which, inside an `if`, is a
            # false condition and passes silently. That is how the F1 defect this
            # step exists to prevent came back through a different door. Take the
            # numerator only, and refuse anything that is not all digits.
            collected=$(pytest "$path" -q --collect-only \
              | awk '/tests? collected/ { sub("/.*", "", $1); print $1; exit }')
            echo "$path: ${collected:-0} collected (floor $floor)"
            case "$collected" in
              ''|*[!0-9]*)
                echo "::error::$path — could not parse a collection count (got '${collected}')."
                echo "::error::Refusing to treat an unparseable count as a pass."
                exit 1
                ;;
            esac
            if [ "$collected" -lt "$floor" ]; then
              echo "::error::$path collected ${collected:-0}, below its floor of $floor"
              exit 1
            fi
          done <<'FLOORS'
          tests/gates 92
          tests/test_engine.py 62
          tests/test_orders.py 66
          tests/test_structure.py 30
          tests/test_lifecycle.py 30
          FLOORS
